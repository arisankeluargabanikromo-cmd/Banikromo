<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex">
<title>Halaman tidak ditemukan · FamilyHub</title>
<style>
body{margin:0;min-height:100vh;display:grid;place-items:center;font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;background:#f4f7fb;color:#172033;text-align:center;padding:24px}
h1{font-size:22px;margin:0 0 8px}p{color:#718096;margin:0 0 20px;font-size:14px}
a{display:inline-block;background:#6957ff;color:#fff;text-decoration:none;padding:11px 18px;border-radius:13px}
</style>
</head>
<body>
<main id="nf" hidden>
  <h1>Halaman tidak ditemukan</h1>
  <p>Alamat ini tidak ada, sudah dipindahkan, atau berkas yang diminta sudah dihapus.</p>
  <a href="/">Kembali ke FamilyHub</a>
</main>
<script>
// Fallback untuk hosting statis tanpa aturan rewrite (mis. GitHub Pages).
// Alamat menu (tanpa ekstensi berkas, mis. /arisan) disimpan lalu aplikasi dimuat dari "/";
// router.js memulihkan alamat itu, jadi refresh/link langsung tetap membuka halaman yang benar.
(function () {
  var p = location.pathname + location.search + location.hash;
  if (!/\.[A-Za-z0-9]+$/.test(location.pathname) && p.charAt(0) === '/' && p.charAt(1) !== '/') {
    try { sessionStorage.setItem('fh:redirect', p); location.replace('/'); return; } catch (e) { }
  }
  document.getElementById('nf').hidden = false;
})();
</script>
<noscript><p>Aktifkan JavaScript untuk membuka FamilyHub. <a href="/">Beranda</a></p></noscript>
</body>
</html>
