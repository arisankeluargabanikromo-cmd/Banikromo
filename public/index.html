<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FamilyHub — Arisan & Family Network</title>
<style>
:root{
  --bg:#f4f7fb; --panel:#ffffff; --panel2:#f8fafc; --text:#172033; --muted:#718096;
  --line:#e7ebf2; --accent:#6957ff; --accent2:#22c7a9; --warning:#f6a623;
  --danger:#ef6b73; --shadow:0 18px 45px rgba(35,45,75,.08); --radius:22px;
}
*{box-sizing:border-box}
body{margin:0;font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:var(--bg);color:var(--text)}
button{font:inherit;border:0;cursor:pointer}
.app{display:flex;min-height:100vh}
.sidebar{width:255px;background:#101426;color:#fff;padding:22px 16px;position:fixed;inset:0 auto 0 0;z-index:20}
.logo{display:flex;align-items:center;gap:12px;padding:10px 10px 28px}
.logo-mark{width:42px;height:42px;border-radius:14px;background:linear-gradient(135deg,#8d7cff,#43d8bd);display:grid;place-items:center;font-weight:800}
.logo strong{font-size:17px}.logo small{display:block;color:#9098ad;font-size:11px;margin-top:2px}
.nav-title{color:#697187;font-size:10px;text-transform:uppercase;letter-spacing:1.4px;padding:14px 12px 8px}
.nav button{width:100%;display:flex;align-items:center;gap:12px;padding:12px;border-radius:13px;background:transparent;color:#aeb5c7;text-align:left;margin:3px 0}
.nav button:hover,.nav button.active{background:rgba(255,255,255,.09);color:#fff}
.nav-icon{width:25px;text-align:center;font-size:17px}.nav button.active .nav-icon{color:#8d7cff}
.sidebar-bottom{position:absolute;bottom:20px;left:16px;right:16px;padding:14px;border:1px solid rgba(255,255,255,.08);border-radius:18px;background:rgba(255,255,255,.04)}
.mini-user{display:flex;gap:10px;align-items:center}.avatar{width:38px;height:38px;border-radius:50%;background:linear-gradient(135deg,#f3b88b,#8d7cff);display:grid;place-items:center;color:white;font-weight:700}
.main{margin-left:255px;width:calc(100% - 255px);padding:26px 32px 40px}
.topbar{display:flex;align-items:center;justify-content:space-between;margin-bottom:26px}
.breadcrumb{color:var(--muted);font-size:13px}.breadcrumb b{color:var(--text)}
.actions{display:flex;gap:10px;align-items:center}.icon-btn{width:42px;height:42px;border-radius:13px;background:var(--panel);border:1px solid var(--line);box-shadow:var(--shadow);position:relative}
.dot{position:absolute;width:7px;height:7px;background:#ef6b73;border:2px solid white;border-radius:50%;right:8px;top:7px}
.primary{background:linear-gradient(135deg,#6957ff,#806fff);color:#fff;padding:11px 17px;border-radius:13px;box-shadow:0 10px 25px rgba(105,87,255,.2)}
.hero{background:linear-gradient(135deg,#171c35,#282b52);color:white;border-radius:28px;padding:28px 30px;display:flex;justify-content:space-between;align-items:center;overflow:hidden;position:relative;margin-bottom:20px;box-shadow:0 20px 50px rgba(20,24,50,.18)}
.hero:after{content:"";position:absolute;width:300px;height:300px;border-radius:50%;right:7%;top:-160px;background:radial-gradient(circle,rgba(126,108,255,.45),transparent 65%)}
.hero h1{font-size:27px;margin:0 0 8px}.hero p{margin:0;color:#b8bfd2;font-size:13px}
.hero-date{position:relative;z-index:1;text-align:right}.hero-date strong{font-size:28px;display:block}.hero-date span{font-size:12px;color:#aab1c5}
.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin-bottom:20px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow)}
.stat{padding:20px;position:relative;overflow:hidden}.stat-top{display:flex;justify-content:space-between;align-items:center}.stat-label{color:var(--muted);font-size:12px}.stat-icon{width:40px;height:40px;border-radius:13px;display:grid;place-items:center;background:#f0edff;color:#6957ff}.stat h2{margin:13px 0 4px;font-size:24px}.stat small{color:#1fa889;font-size:11px}.stat .wave{position:absolute;right:-20px;bottom:-35px;width:110px;height:70px;border-radius:50%;background:#f5f2ff}
.content2{display:grid;grid-template-columns:1.55fr 1fr;gap:20px;margin-bottom:20px}
.card-head{display:flex;justify-content:space-between;align-items:center;padding:20px 20px 12px}.card-head h3{font-size:15px;margin:0}.card-head span{font-size:11px;color:var(--muted)}
.chart-card{padding-bottom:16px}.chart{height:210px;padding:10px 20px;position:relative}.chart svg{width:100%;height:100%}.legend{display:flex;gap:20px;font-size:11px;color:var(--muted);padding:0 20px}.legend i{display:inline-block;width:8px;height:8px;border-radius:50%;background:#6957ff;margin-right:5px}.legend i.g{background:#22c7a9}
.next{padding:20px}.event-date{display:flex;gap:14px;align-items:center}.datebox{width:54px;height:60px;border-radius:15px;background:#f0edff;color:#6957ff;text-align:center;padding-top:8px}.datebox b{font-size:19px;display:block}.datebox small{font-size:9px}.next h4{margin:0 0 5px}.next p{margin:0;color:var(--muted);font-size:12px}.progress{height:7px;background:#edf0f5;border-radius:10px;margin:17px 0 8px;overflow:hidden}.progress span{display:block;height:100%;width:78%;background:linear-gradient(90deg,#6957ff,#22c7a9);border-radius:10px}.split{display:flex;justify-content:space-between;color:var(--muted);font-size:10px}
.activity{padding-bottom:8px}.activity-row{display:flex;gap:12px;padding:13px 20px;border-top:1px solid var(--line)}.activity-row:first-of-type{border-top:0}.activity-icon{width:34px;height:34px;border-radius:11px;background:#f0f9f6;display:grid;place-items:center;color:#22a88f}.activity-text{font-size:12px}.activity-text b{display:block;margin-bottom:3px}.activity-text span{color:var(--muted);font-size:10px}
.bottomgrid{display:grid;grid-template-columns:1fr 1fr;gap:20px}
.members{padding-bottom:10px}.member-row{display:flex;align-items:center;gap:12px;padding:12px 20px;border-top:1px solid var(--line)}.member-row:first-of-type{border-top:0}.member-row .avatar{width:36px;height:36px;font-size:11px}.member-info{flex:1}.member-info b{font-size:12px}.member-info span{display:block;color:var(--muted);font-size:10px;margin-top:2px}.status{font-size:10px;padding:5px 8px;border-radius:20px;background:#eaf8f4;color:#159578}.status.pending{background:#fff6df;color:#bf8315}
.tree-wrap{padding:10px 20px 24px;overflow:auto}.tree{min-width:640px;text-align:center}.node{display:inline-flex;flex-direction:column;align-items:center;padding:10px 14px;background:#fff;border:1px solid #ddd9ff;border-radius:16px;box-shadow:0 8px 20px rgba(70,60,130,.08);cursor:pointer;transition:.2s}.node:hover{transform:translateY(-3px);box-shadow:0 14px 25px rgba(70,60,130,.13)}.node .avatar{width:42px;height:42px;margin-bottom:6px}.node b{font-size:11px}.node span{font-size:9px;color:var(--muted);margin-top:2px}.connector{height:25px;width:1px;background:#cfd3df;margin:auto}.branches{display:flex;justify-content:center;gap:55px;position:relative}.branches:before{content:"";position:absolute;top:0;left:15%;right:15%;height:1px;background:#cfd3df}.branch{position:relative;padding-top:25px}.branch:before{content:"";position:absolute;top:0;left:50%;height:25px;width:1px;background:#cfd3df}
.page{display:none}.page.active{display:block}
.toolbar{display:flex;gap:10px;margin-bottom:15px}.search{flex:1;padding:12px 14px;border:1px solid var(--line);border-radius:13px;background:#fff;outline:none}.select{padding:12px;border:1px solid var(--line);border-radius:13px;background:#fff}
.table{width:100%;border-collapse:collapse}.table th,.table td{text-align:left;padding:14px 18px;border-top:1px solid var(--line);font-size:12px}.table th{color:var(--muted);font-weight:600;font-size:10px;text-transform:uppercase}.money{font-weight:700}
.modal{display:none;position:fixed;inset:0;background:rgba(10,15,30,.55);z-index:50;align-items:center;justify-content:center;padding:20px}.modal.show{display:flex}.modal-box{background:#fff;width:min(460px,100%);border-radius:25px;padding:25px;box-shadow:0 30px 80px rgba(0,0,0,.25)}.modal-top{display:flex;justify-content:space-between}.close{background:#f2f4f8;border-radius:10px;width:34px;height:34px}.profile{text-align:center}.profile .avatar{width:75px;height:75px;margin:auto;font-size:24px}.profile h2{margin:12px 0 4px}.profile p{color:var(--muted);font-size:12px;margin:0 0 20px}.detail-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.detail{background:#f7f8fb;padding:12px;border-radius:14px}.detail span{display:block;color:var(--muted);font-size:9px}.detail b{display:block;margin-top:4px;font-size:12px}
.toast{position:fixed;right:25px;bottom:25px;background:#171c35;color:white;padding:13px 17px;border-radius:14px;box-shadow:var(--shadow);display:none;z-index:70;font-size:12px}.toast.show{display:block}
body.dark{
 --bg:#0b0f1b;--panel:#121827;--panel2:#171e2d;--text:#edf1fa;--muted:#8e99ae;
 --line:#252e40;--shadow:0 18px 45px rgba(0,0,0,.28)
}
body.dark .card,body.dark .icon-btn,body.dark .search,body.dark .select{background:var(--panel);color:var(--text);border-color:var(--line)}
body.dark .node{background:#151c2b;border-color:#343d59;color:var(--text)}
body.dark .detail,body.dark .datebox,.dark .stat-icon{background:#1b2235}
body.dark .modal-box{background:#121827;color:var(--text)}
body.dark .close{background:#20283a;color:#fff}
body.dark .hero{background:linear-gradient(135deg,#090d18,#171d35)}
body.dark .table th,body.dark .table td{border-color:var(--line)}
body.dark .table button{background:transparent;color:#a99fff}
body.dark .activity-row,body.dark .member-row{border-color:var(--line)}
body.dark .progress{background:#252c3b}
body.dark .wave{background:#1b2032}
body.dark .tree .connector,body.dark .branch:before,.dark .branches:before{background:#394257}

@media(max-width:1100px){.grid4{grid-template-columns:repeat(2,1fr)}.content2,.bottomgrid{grid-template-columns:1fr}}
@media(max-width:760px){.sidebar{width:72px;padding:15px 9px}.logo{padding:8px 5px 22px}.logo div:not(.logo-mark),.nav-title,.nav button span,.sidebar-bottom{display:none}.nav button{justify-content:center}.main{margin-left:72px;width:calc(100% - 72px);padding:18px}.hero{padding:22px}.hero-date{display:none}.grid4{grid-template-columns:1fr 1fr;gap:10px}.stat{padding:15px}.stat h2{font-size:19px}.topbar .breadcrumb{display:none}.actions .primary{display:none}}
@media(max-width:480px){.grid4{grid-template-columns:1fr}.main{padding:12px}.hero h1{font-size:22px}}
</style>
<link rel="stylesheet" href="/style.css">
</head>
<body>
<div class="app">
<aside class="sidebar">
  <div class="logo"><div class="logo-mark">FH</div><div><strong>FamilyHub</strong><small>Arisan & Family Network</small></div></div>
  <div class="nav-title">Menu utama</div>
  <nav class="nav">
    <button class="active" onclick="showPage('dashboard',this)"><span class="nav-icon">⌂</span><span>Dashboard</span></button>
    <button onclick="showPage('arisan',this)"><span class="nav-icon">◎</span><span>Arisan</span></button>
    <button onclick="showPage('pengocokan',this)"><span class="nav-icon">⚡</span><span>Pengocokan Digital</span></button>
    <button onclick="showPage('silsilah',this)"><span class="nav-icon">♧</span><span>Silsilah Keluarga</span></button>
    <button onclick="showPage('anggota',this)"><span class="nav-icon">♙</span><span>Anggota</span></button>
    <button onclick="showPage('keuangan',this)"><span class="nav-icon">◈</span><span>Keuangan</span></button>
    <button onclick="showPage('agenda',this)"><span class="nav-icon">◫</span><span>Agenda</span></button>
    <button onclick="showPage('galeri',this)"><span class="nav-icon">▧</span><span>Dokumentasi</span></button>
  </nav>
  <div class="nav-title">Informasi</div>
  <nav class="nav">
    <button onclick="showPage('pengumuman',this)"><span class="nav-icon">◌</span><span>Pengumuman</span></button>
    <button onclick="showPage('laporan',this)"><span class="nav-icon">▤</span><span>Laporan</span></button>
  </nav>
  <div class="sidebar-bottom"><div class="mini-user"><div class="avatar">PS</div><div><b style="font-size:11px">Purwoko</b><small style="display:block;color:#858ca0;font-size:9px">Admin keluarga</small></div></div></div>
</aside>

<main class="main">
<div class="topbar"><div class="breadcrumb">FamilyHub / <b id="pageTitle">Dashboard</b></div><div class="actions"><button class="icon-btn" onclick="toast('Tidak ada notifikasi baru')">♧<i class="dot"></i></button><button class="icon-btn" onclick="toggleTheme()">◐</button><button class="primary" onclick="quickAdd()">＋ Tambah</button></div></div>

<section id="dashboard" class="page active"></section>
<section id="arisan" class="page"></section>
<section id="pengocokan" class="page"></section>
<section id="silsilah" class="page"></section>
<section id="anggota" class="page"></section>
<section id="keuangan" class="page"></section>
<section id="agenda" class="page"></section>
<section id="galeri" class="page"></section>
<section id="pengumuman" class="page"></section>
<section id="laporan" class="page"></section>
</main>
</div>
<div class="modal" id="profileModal"><div class="modal-box" id="profileBox"></div></div>
<div class="modal" id="formModal"><div class="modal-box"><div class="modal-top"><b id="fTitle"></b><button class="close" onclick="closeForm()">×</button></div><form id="fForm" class="fform"></form></div></div>
<div class="login" id="loginBox"><form class="modal-box" id="loginForm"><div class="logo-mark" style="margin:0 auto 12px;color:#fff;width:52px;height:52px">FH</div><h2 style="text-align:center;margin:0 0 4px">FamilyHub</h2><p style="text-align:center;color:var(--muted);font-size:12px;margin:0 0 18px">Masuk untuk melanjutkan</p><label>Email<input name="username" type="email" autocomplete="username" required></label><label>Password<input name="password" type="password" autocomplete="current-password" required></label><button class="primary" style="width:100%;margin-top:14px">Masuk</button><button type="button" id="signupBtn" class="ghost" style="width:100%;margin-top:8px;padding:11px;border-radius:13px">Daftar akun baru</button></form></div>
<div class="toast" id="toast"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="/config.js"></script>
<script src="/data.js"></script>
<script src="/app.js"></script>
</body>
</html>
